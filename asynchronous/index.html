<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Random Person | Async JavaScript</title>
</head>
<body class="min-h-screen bg-slate-950 text-white">
    <main class="mx-auto max-w-3xl px-5 py-12">
        <header class="mb-8">
            <p class="text-sm font-semibold uppercase tracking-[0.2em] text-cyan-300">Async JavaScript</p>
            <h1 class="mt-2 text-4xl font-bold tracking-tight">Random person</h1>
            <p class="mt-2 text-slate-400">Get a random person from randomuser.me.</p>
        </header>

        <form class="person-form rounded-3xl border border-slate-800 bg-slate-900 p-6 shadow-xl">
            <div class="flex flex-col items-center gap-6 sm:flex-row sm:items-start">
                <img class="photo h-32 w-32 rounded-full border-2 border-slate-700 bg-slate-800 object-cover" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="Profile picture">

                <div class="w-full space-y-4">
                    <div>
                        <label class="mb-1 block text-sm font-medium text-slate-300" for="name">Name</label>
                        <input id="name" class="name w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 text-white placeholder:text-slate-600" type="text" placeholder="Click “Get person”" readonly>
                    </div>
                    <div>
                        <label class="mb-1 block text-sm font-medium text-slate-300" for="email">Email</label>
                        <input id="email" class="email w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 text-white placeholder:text-slate-600" type="email" placeholder="Email will appear here" readonly>
                    </div>
                    <div>
                        <label class="mb-1 block text-sm font-medium text-slate-300" for="address">Address</label>
                        <input id="address" class="address w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 text-white placeholder:text-slate-600" type="text" placeholder="Address will appear here" readonly>
                    </div>
                </div>
            </div>

            <button class="get-btn mt-6 rounded-xl bg-cyan-500 px-5 py-3 font-semibold text-slate-950 hover:bg-cyan-400 disabled:opacity-50" type="submit">Get person</button>
            <p class="message mt-3 min-h-6 text-sm text-slate-400" role="status" aria-live="polite"></p>
        </form>
    </main>
    <script src="app.js" defer></script>
</body>
</html>
